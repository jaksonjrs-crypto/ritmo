<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#758A32" />
    <title>Ritmo — sem conexão</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f5ef; color: #20211d; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 28px; background: #fff; border: 1px solid #e8e5dc; border-radius: 24px; box-shadow: 0 12px 32px #20211d12; }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: 24px; color: #fff; background: #758a32; border-radius: 16px; font-size: 28px; font-weight: 700; }
      h1 { margin: 0 0 12px; font-size: 25px; line-height: 1.2; }
      p { margin: 0 0 22px; color: #62635c; line-height: 1.55; }
      button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; color: #fff; background: #758a32; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid #d77c5d; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">r</div>
      <h1>Você está sem conexão.</h1>
      <p>Quando o Ritmo já tiver sido aberto neste aparelho, suas tarefas e metas salvas localmente continuarão disponíveis. Reconecte-se e tente carregar novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
